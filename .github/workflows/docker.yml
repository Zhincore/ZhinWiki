name: Docker

# Docker builds are deliberately manual. Pull requests and pushes must not
# spend runner time building images or publish artifacts implicitly.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: main
        type: string
      image_tag:
        description: Container tag to produce
        required: true
        default: latest
        type: string
      platforms:
        description: Target platforms
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
      publish:
        description: Publish the image to GHCR
        required: true
        default: false
        type: boolean

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build self-host image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve immutable source revision
        id: source
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout did not resolve to a full Git revision"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$sha" >> "$GITHUB_OUTPUT"

      - name: Validate dispatch
        env:
          TAG: ${{ inputs.image_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $TAG"
            exit 1
          fi

          if [[ "$TAG" == sha-* && "$TAG" != "sha-$SOURCE_SHA" ]]; then
            echo "::error::SHA image tag must match the source revision"
            exit 1
          fi


      # QEMU emulates arm64 so the published image runs on Graviton/Ampere/
      # Raspberry Pi hosts as well as amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject existing immutable image tags
        if: inputs.publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TAG: ${{ inputs.image_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reject-existing-immutable-tags.mjs

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=${{ steps.source.outputs.image_tag }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.source.outputs.sha }}
            VITE_API_URL=http://server:4311
            VITE_APP_URL=https://nibleaf.com
            VITE_SITE_BASE_DOMAIN=nibleaf.com
          cache-from: |
            type=gha,scope=nibleaf-image
          cache-to: |
            type=gha,mode=max,scope=nibleaf-image,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Verify published immutable image
        if: inputs.publish
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/verify-published-image.mjs

      - name: Attest published image provenance
        if: inputs.publish
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

