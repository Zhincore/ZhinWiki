packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

nodeLinker: hoisted

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - '@prisma/client'
  - esbuild
  - sharp

overrides:
  # Keep vulnerable transitive tooling out of clean installs. Remove an
  # override once every upstream dependency accepts the fixed version.
  '@ai-sdk/provider-utils@>=4.0.0 <4.0.33': 4.0.33
  '@tiptap/extension-bubble-menu': 3.30.4
  '@tiptap/extension-floating-menu': 3.30.4
  '@tiptap/y-tiptap': 3.0.7
  '@tryghost/kg-default-nodes@2.1.5>html-minifier': '-'
  '@tryghost/kg-default-nodes@2.2.0>html-minifier': '-'
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  deepmerge-ts: 8.0.2
  dompurify@>=3.0.0 <3.4.16: 3.4.16
  engine.io@>=6.0.0 <6.6.10: 6.6.10
  fast-uri@>=3.0.0 <3.1.8: 3.1.8
  hono@>=4.0.0 <4.13.7: 4.13.7
  http-cache-semantics@>=4.0.0 <4.3.0: 4.3.0
  katex@<0.18.2: 0.18.5
  markdown-it@>=14.0.0 <14.3.1: 14.3.1
  markdown-it-image-lazy-loading@2.0.1>image-size: 2.0.3
  mysql2: 3.23.1
  next@>=16.0.0 <16.3.8: 16.3.8
  proxy-addr@>=2.0.0 <2.0.8: 2.0.8
  qs: 6.16.0
  sharp@>=0.35.0 <0.35.5: 0.35.5
  smol-toml@>=1.8.0 <1.9.0: 1.9.0
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  undici: 7.29.1
  vite@8.2.2>rolldown: 1.2.7

patchedDependencies:
  markdown-it-image-lazy-loading@2.0.1: patches/markdown-it-image-lazy-loading@2.0.1.patch
